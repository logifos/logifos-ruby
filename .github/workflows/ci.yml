name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  rspec:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: [ '3.2', '3.3', '3.4', '4.0' ]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Source specs
        run: bundle exec rspec --exclude-pattern spec/package_smoke_spec.rb
      - name: Installed package smoke
        env:
          TMPDIR: ${{ runner.temp }}
        run: bundle exec rspec spec/package_smoke_spec.rb
